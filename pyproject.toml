[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-validator"
version = "0.1.0"
description = "Notebook metadata and profile validator"
dependencies = ["pytest>=7.0", "nb-profiles-native @ https://github.com/Millstone123/nb-profiles-native/releases/download/v0.1.0/nb_profiles_native-0.1.0-py3-none-macosx_11_0_arm64.whl"]

